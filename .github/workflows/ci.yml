name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version consistency
        run: python scripts/sync_version.py --check

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check src tests --exit-zero --statistics

      - name: Install deps
        run: python -m pip install pyyaml
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t .
      - name: JS syntax
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem src/cover_pipeline/server/static/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $bad = 1 }
          }
          if ($bad -ne 0) { exit 1 }

      - name: Packaging self-check
        env:
          PYTHONPATH: src
        run: python scripts/package.py --scan-only
