name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version consistency
        run: python scripts/sync_version.py --check

      - name: Lint
        # ruff 锁版本：规则集随版本变，不锁的话哪天 CI 会突然红给你看。
        # 现在 src/tests 是 0 告警，所以这一条可以从「非阻断」转正了（0.4.2 起）。
        run: |
          python -m pip install ruff==0.17.4
          ruff check src tests

      - name: Install deps
        run: python -m pip install pyyaml
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t .
      - name: JS syntax (ESM，拆包后子目录也一起查)
        run: python scripts/check_frontend.py --syntax

      - name: Frontend static checks (non-blocking)
        continue-on-error: true
        run: python scripts/check_frontend.py --static

      - name: Packaging self-check
        env:
          PYTHONPATH: src
        run: python scripts/package.py --scan-only
