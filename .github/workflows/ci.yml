name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t .
      - name: Packaging self-check
        env:
          PYTHONPATH: src
        run: python scripts/package.py --scan-only
