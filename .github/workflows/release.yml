name: Release

# 推一个 v* 标签 → 自动打包（绿色版 zip + Inno 安装包）→ 传成 release 资产。
#
# 以前这一步全靠手工：本地 build-installer.ps1，再手动拖两个文件上传。
# 现在只要 `git tag v0.4.3 && git push origin v0.4.3` 就行。
# 注意：这是「第一次跑才会验证」的流水线，本地已经用同一个 build-installer.ps1 跑通过。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install pyyaml

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable + installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "打包失败" }

      - name: Rename assets to ASCII + checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $init = Get-Content "src\cover_pipeline\__init__.py" -Raw -Encoding UTF8
          $v = [regex]::Match($init, '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          $zip = "dist\卿音-$v-portable.zip"
          $exe = "dist\卿音-$v-setup.exe"
          if (-not (Test-Path $zip)) { throw "没生成 $zip" }
          if (-not (Test-Path $exe)) { throw "没生成 $exe" }
          Move-Item $zip "dist\qingyin-$v-portable.zip" -Force
          Move-Item $exe "dist\qingyin-$v-setup.exe" -Force
          $lines = @()
          Get-ChildItem "dist\qingyin-*" -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($_.Name)"
          }
          Set-Content "dist\SHA256SUMS.txt" -Value ($lines -join "`n") -Encoding ascii
          Get-ChildItem "dist" -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qingyin-*-portable.zip
            dist/qingyin-*-setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
