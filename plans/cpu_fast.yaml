id: cpu_fast
name: "纯 CPU · 快速出片"
tier: 0
advanced: false
for:
  gpu_required: false
  min_vram_gb: 0
  max_vram_gb: 0
  min_disk_gb: 8
  needs_train: no
scores: { quality: 2, speed: 2, space: 5, stability: 4 }
params:
