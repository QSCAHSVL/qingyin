[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-pipeline"
version = "0.4.3"
description = "一条命令完成翻唱全流程：训练、分离、转换、混音、挑段"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cover-pipeline contributors" }]
keywords = ["rvc", "cover", "voice-conversion", "uvr", "audio", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["gradio>=4.0"]
dev = ["pytest>=8.0", "ruff==0.17.4"]

[project.scripts]
cover = "cover_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 这些规则是「故意这么写的」，不是疏忽，别让它们把真正的告警淹掉：
#   BLE001 / S110 / S112 —— 音源、外部工具、清理逻辑都是「尽力而为」，失败就降级，不中断主流程
#   PLW1510 —— 有些子进程就是要看返回码自己判断（分离/转换），不能一把 check=True
ignore = ["BLE001", "S110", "S112", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]
